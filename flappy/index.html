<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07131d">
    <meta name="description" content="CashArcade 霓虹飛行：拍動飛行器、穿越能源閘門的純前端無盡街機遊戲。">
    <title>CashArcade — 霓虹飛行</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="arcade-shell">
        <header class="site-header">
            <a class="brand" href="../" aria-label="CashArcade 首頁">
                <span class="brand-mark" aria-hidden="true">CA</span>
                <span><strong>CashArcade</strong><small>INSERT FOCUS TO FLY</small></span>
            </a>
            <button class="icon-button" id="theme-toggle" type="button" aria-label="切換亮暗主題" title="切換亮暗主題">◐</button>
        </header>

        <section class="game-card" aria-labelledby="game-title">
            <div class="game-heading">
                <div><p class="eyebrow">ARCADE 003</p><h1 id="game-title">霓虹飛行</h1></div>
                <div class="status-light"><span aria-hidden="true"></span><strong id="status-text">準備</strong></div>
            </div>

            <div class="score-strip" aria-label="遊戲資訊">
                <div><span>分數</span><strong id="score">0000</strong></div>
                <div><span>最高分</span><strong id="high-score">0000</strong></div>
                <div><span>速度</span><strong id="speed">×1.0</strong></div>
            </div>

            <div class="canvas-frame">
                <canvas id="game-canvas" width="720" height="540" aria-label="霓虹飛行遊戲區域"></canvas>
                <div class="game-overlay" id="game-overlay">
                    <p class="overlay-kicker" id="overlay-kicker">READY TO LAUNCH?</p>
                    <h2 id="overlay-title">準備起飛</h2>
                    <p id="overlay-message">點擊、觸控或按 Space，穿越每一道能源閘門。</p>
                    <button class="primary-button" id="start-button" type="button">開始飛行</button>
                </div>
            </div>

            <div class="game-actions">
                <button class="secondary-button" id="pause-button" type="button" disabled>暫停</button>
                <button class="secondary-button" id="restart-button" type="button">重新開始</button>
            </div>

            <p class="instructions">
                <span><kbd>Space</kbd> / <kbd>↑</kbd> / <kbd>W</kbd> 拍翼</span>
                <span>點擊或觸控畫面拍翼</span>
                <span><kbd>P</kbd> / <kbd>Esc</kbd> 暫停</span>
                <span><kbd>R</kbd> 重開</span>
            </p>
            <p class="sr-only" id="live-region" aria-live="polite"></p>
        </section>

        <footer><a href="../">← ALL GAMES</a><a href="https://github.com/darkerduck/CashArcade">SOURCE ↗</a></footer>
    </main>

    <script src="./game.js" defer></script>
</body>
</html>
