<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07131d">
    <meta name="description" content="CashArcade 霓虹飛行：操控霓虹小鳥，拍動羽翼穿越雲海與能源閘門的純前端街機遊戲。">
    <title>CashArcade — 霓虹飛行</title>
    <link rel="icon" href="../favicon.ico?v=1" type="image/x-icon" sizes="16x16 32x32 48x48 64x64 128x128 256x256">
    <link rel="icon" href="../assets/brand/favicon-32.png?v=1" type="image/png" sizes="32x32">
    <link rel="icon" href="../assets/brand/favicon-16.png?v=1" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png?v=1" sizes="180x180">
    <link rel="manifest" href="../site.webmanifest?v=1">
    <link rel="stylesheet" href="./style.css?v=2">
    <link rel="stylesheet" href="../music.css?v=1">
    <link rel="stylesheet" href="../brand.css?v=1">
</head>
<body>
    <main class="arcade-shell">
        <header class="site-header">
            <a class="brand" href="../" aria-label="CashArcade 首頁">
                <img class="brand-logo" src="../assets/brand/casharcade-logo.png?v=1" width="44" height="44" alt="" aria-hidden="true">
                <span><strong>CashArcade</strong><small>INSERT FOCUS TO FLY</small></span>
            </a>
            <div class="header-controls">
                <button class="icon-button sound-toggle" id="sound-toggle" type="button" aria-label="關閉音效" aria-pressed="true" title="關閉音效"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4"/><path class="sound-wave" d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/><path class="sound-slash" d="M3 21 21 3"/></svg></button>
                <button class="icon-button" id="theme-toggle" type="button" aria-label="切換亮暗主題" title="切換亮暗主題">◐</button>
            </div>
        </header>

        <section class="game-card" aria-labelledby="game-title">
            <div class="game-heading">
                <div><p class="eyebrow">ARCADE 003</p><h1 id="game-title">霓虹飛行</h1></div>
                <div class="status-light"><span aria-hidden="true"></span><strong id="status-text">準備</strong></div>
            </div>

            <div class="score-strip" aria-label="遊戲資訊">
                <div><span>分數</span><strong id="score">0000</strong></div>
                <div><span>最高分</span><strong id="high-score">0000</strong></div>
                <div><span>速度</span><strong id="speed">×1.0</strong></div>
            </div>

            <div class="canvas-frame">
                <canvas id="game-canvas" width="720" height="540" aria-label="霓虹小鳥飛越能源閘門的遊戲區域"></canvas>
                <div class="game-overlay" id="game-overlay">
                    <p class="overlay-kicker" id="overlay-kicker">READY TO LAUNCH?</p>
                    <div class="overlay-portrait"><canvas id="bird-preview" width="200" height="140" aria-hidden="true"></canvas><h2 id="overlay-title">準備起飛</h2></div>
                    <p id="overlay-message">點擊、觸控或按 Space，穿越每一道能源閘門。</p>
                    <button class="primary-button" id="start-button" type="button">開始飛行</button>
                </div>
            </div>

            <div class="game-actions">
                <button class="secondary-button" id="pause-button" type="button" disabled>暫停</button>
                <button class="secondary-button" id="restart-button" type="button">重新開始</button>
            </div>

            <div class="music-panel" aria-label="背景音樂控制">
                <button class="music-toggle" id="music-toggle" type="button" aria-label="關閉背景音樂" aria-pressed="true">♫ 音樂：開</button>
                <div class="music-info"><small>ORIGINAL CHIPTUNE / 飛行配樂</small><span id="music-track">逐光羽翼 · 待命</span></div>
                <label class="music-volume" for="music-volume">音樂音量 <output id="music-volume-value" for="music-volume">65%</output><input id="music-volume" type="range" min="0" max="100" step="5" value="65"></label>
                <p>起飛後播放，暫停同步停樂；每十分增加編曲密度，最多三階。音樂與音效分別控制。</p>
            </div>
            <p class="instructions">
                <span><kbd>Space</kbd> / <kbd>↑</kbd> / <kbd>W</kbd> 拍翼</span>
                <span>點擊或觸控畫面拍翼</span>
                <span><kbd>P</kbd> / <kbd>Esc</kbd> 暫停</span>
                <span><kbd>R</kbd> 重開</span>
            </p>
            <p class="sr-only" id="live-region" aria-live="polite"></p>
        </section>

        <footer><a href="../">← ALL GAMES</a><a href="https://github.com/darkerduck/CashArcade">SOURCE ↗</a></footer>
    </main>

    <script src="../audio.js?v=7" defer></script>
    <script src="../music.js?v=1" defer></script><script src="../music-scores.js?v=1" defer></script>
    <script src="./renderer.js?v=1" defer></script>
    <script src="./game.js?v=4" defer></script>
</body>
</html>
